<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Isola">
  <title id="title">Isola</title>
  <desc id="desc">A tiled board with two opposing pieces.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292929"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <radialGradient id="red" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ff7777"/>
      <stop offset="0.62" stop-color="#d83f48"/>
      <stop offset="1" stop-color="#92232d"/>
    </radialGradient>
    <radialGradient id="dark" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#777777"/>
      <stop offset="0.55" stop-color="#353535"/>
      <stop offset="1" stop-color="#111111"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8"/>
      <feOffset dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="9" fill="#101010"/>
  <g stroke="#090909" stroke-width="1.5">
    <rect x="3" y="3" width="27" height="27" rx="2.5" fill="url(#tile)"/>
    <rect x="34" y="3" width="27" height="27" rx="2.5" fill="url(#tile)"/>
    <rect x="3" y="34" width="27" height="27" rx="2.5" fill="url(#tile)"/>
    <rect x="34" y="34" width="27" height="27" rx="2.5" fill="url(#tile)"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="16.5" cy="16.5" r="9.2" fill="url(#red)" stroke="#f08080" stroke-width="1.2"/>
    <circle cx="16.5" cy="14.2" r="4.4" fill="#ffffff" opacity=".12"/>
    <circle cx="47.5" cy="47.5" r="9.2" fill="url(#dark)" stroke="#858585" stroke-width="1.2"/>
    <circle cx="47.5" cy="45.2" r="4.4" fill="#ffffff" opacity=".12"/>
  </g>
</svg>
