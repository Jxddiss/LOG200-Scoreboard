---
name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Point the page at the server
        env:
          SERVER: ${{ vars.SCOREBOARD_URL }}
        run: |
          if [[ ! "$SERVER" =~ ^https://[^/\"]+$ ]]; then
            echo "::error::Variable de depot SCOREBOARD_URL absente ou invalide (attendu : https://domaine, sans / final)"
            exit 1
          fi
          for page in web/dist/*.html; do
            sed -i "s|<meta name=\"scoreboard-server\" content=\"\"|<meta name=\"scoreboard-server\" content=\"$SERVER\"|" "$page"
            grep -q "content=\"$SERVER\"" "$page"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload page
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
