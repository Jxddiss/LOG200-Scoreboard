---
name: Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test
        run: node --test web/*.test.mjs

      - name: Point the page at the server
        env:
          SERVER: ${{ vars.SCOREBOARD_URL }}
        run: |
          if [[ ! "$SERVER" =~ ^https://[^/\"]+$ ]]; then
            echo "::error::Variable de depot SCOREBOARD_URL absente ou invalide (attendu : https://domaine, sans / final)"
            exit 1
          fi
          for page in web/*.html; do
            sed -i "s|<meta name=\"scoreboard-server\" content=\"\"|<meta name=\"scoreboard-server\" content=\"$SERVER\"|" "$page"
            grep -q "content=\"$SERVER\"" "$page"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload page
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
