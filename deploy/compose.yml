# Ladder Isolation. Dans ce dossier : ladder.toml, jars/ et data/ (voir README.md), puis
#   docker compose up -d                       # ladder et API ; page sur GitHub Pages
#   COMPOSE_PROFILES=web docker compose up -d  # avec la page sur ce serveur
# Tout est servi en HTTP sur le port 8080 ; un reverse proxy peut se placer devant.
name: isolation-scoreboard

services:
  ladder:
    image: ghcr.io/vianatets/log200-scoreboard:${SCOREBOARD_TAG:-latest}
    # Docker interne + gVisor : chaque jar tourne dans un bac a sable sans reseau.
    privileged: true
    # Un init en PID 1 ramasse les containerd-shim orphelins des bacs a sable (l'image en a deja un ;
    # celui-ci couvre aussi une image plus ancienne).
    init: true
    restart: unless-stopped
    # SIGTERM : le ladder finit ses parties avant de sortir. Pire cas : une partie de tournoi, 14 min.
    stop_grace_period: 15m
    volumes:
      - ./ladder.toml:/srv/ladder.toml:ro
      - ./jars:/srv/jars
      - ./data:/srv/data
      - docker:/var/lib/docker

  gateway:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/srv/data:ro

  web:
    image: ghcr.io/vianatets/log200-scoreboard-web:${SCOREBOARD_TAG:-latest}
    profiles: [web]
    restart: unless-stopped

volumes:
  docker:
